spring:
  application:
    name: multitrack

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/multitrack_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

jwt:
  private-key: ${JWT_PRIVATE_KEY:classpath:keys/private.pem}
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:86400}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs